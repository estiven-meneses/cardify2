<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gradiente de fondo -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>
    
    <!-- Gradiente para la tarjeta trasera -->
    <linearGradient id="backCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Gradiente para la tarjeta frontal -->
    <linearGradient id="frontCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Gradiente para el chip dorado -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filtro de sombra profunda -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>

    <filter id="frontShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#0f172a" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Contenedor Base Squircle con Gradiente -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Tarjeta Trasera (Dorso) -->
  <g filter="url(#cardShadow)" transform="translate(130, 95) rotate(8)">
    <rect width="270" height="170" rx="18" fill="url(#backCardGrad)" />
    <!-- Banda magnética -->
    <rect x="0" y="24" width="270" height="34" fill="#334155" opacity="0.9" />
    <!-- Líneas de firma / código -->
    <rect x="22" y="80" width="130" height="22" rx="4" fill="#cbd5e1" opacity="0.8" />
    <rect x="165" y="84" width="45" height="14" rx="3" fill="#94a3b8" opacity="0.6" />
    <!-- Líneas de datos -->
    <rect x="22" y="120" width="180" height="8" rx="4" fill="#94a3b8" opacity="0.5" />
    <rect x="22" y="136" width="120" height="8" rx="4" fill="#94a3b8" opacity="0.4" />
  </g>

  <!-- Tarjeta Frontal (Frente) -->
  <g filter="url(#frontShadow)" transform="translate(105, 185) rotate(-5)">
    <rect width="285" height="180" rx="20" fill="url(#frontCardGrad)" />
    
    <!-- Chip EMV Inteligente -->
    <rect x="30" y="32" width="40" height="30" rx="6" fill="url(#chipGrad)" />
    <path d="M30 47h40M50 32v30M38 32v30M62 32v30" stroke="#b45309" stroke-width="1.5" opacity="0.6" />

    <!-- Foto Avatar -->
    <rect x="210" y="32" width="48" height="58" rx="10" fill="#e0e7ff" stroke="#c7d2fe" stroke-width="2" />
    <circle cx="234" cy="52" r="12" fill="#6366f1" opacity="0.8" />
    <path d="M216 84c0-10 8-15 18-15s18 5 18 15" fill="#6366f1" opacity="0.8" />

    <!-- Líneas de datos personales -->
    <rect x="30" y="82" width="110" height="12" rx="6" fill="#1e293b" opacity="0.85" />
    <rect x="30" y="104" width="150" height="8" rx="4" fill="#64748b" opacity="0.6" />
    <rect x="30" y="118" width="90" height="8" rx="4" fill="#64748b" opacity="0.45" />

    <!-- Logo / Sello inferior -->
    <circle cx="42" cy="148" r="10" fill="#3b82f6" opacity="0.7" />
    <circle cx="56" cy="148" r="10" fill="#8b5cf6" opacity="0.7" />
  </g>
</svg>
